# Organisation (`people/organisation`), a Domain module of the People
# container: a company's positions, their immutable effective-dated title
# versions and the effective-dated assignments of employees to them.
# Discovered by the Platform when the container is mounted at
# apps/domains/people; never built alone.
[package]
name = "bilibi-people-organisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
askama.workspace = true
bilibi-menu.workspace = true
bilibi-ui.workspace = true
# The scan cursor's URL-safe transport; the version Core Agent Access, Core
# User and Base Artifacts already build with.
base64 = "0.23.1"
bilibi-agent-api.workspace = true
bilibi-audit.workspace = true
bilibi-authz.workspace = true
bilibi-company.workspace = true
bilibi-database.workspace = true
bilibi-module-registry.workspace = true
bilibi-people-settings = { path = "../settings" }
bilibi-people-workforce = { path = "../workforce" }
bilibi-ports.workspace = true
bilibi-tenancy.workspace = true
inventory.workspace = true
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-postgres.workspace = true
