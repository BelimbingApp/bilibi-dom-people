# Workforce (`people/workforce`), a Domain module of the People container.
# Discovered by the Platform when the container is mounted at
# apps/domains/people; never built alone.
[package]
name = "bilibi-people-workforce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bilibi-affiliation.workspace = true
bilibi-authz.workspace = true
bilibi-company.workspace = true
bilibi-database.workspace = true
bilibi-module-registry.workspace = true
bilibi-party-ids.workspace = true
bilibi-person.workspace = true
bilibi-ports.workspace = true
bilibi-principal-directory.workspace = true
bilibi-settings.workspace = true
bilibi-tenancy.workspace = true
bilibi-ui.workspace = true
askama.workspace = true
inventory.workspace = true
jiff = "0.2.38"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio-postgres.workspace = true

[dev-dependencies]
# Cargo makes a member of every path dependency of a member, dev-dependencies
# included, so this edge is what lets the mounted gates format, lint and build
# the walkthrough. It is never a `[dependencies]` entry: the product does not
# link the fixture.
bilibi-people-walkthrough = { path = "../fixtures/walkthrough" }
