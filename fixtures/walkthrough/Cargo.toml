# The People walkthrough: example-only, run against a disposable database.
# Discovery never sees `fixtures/`; the workforce crate lists this crate as a
# dev-dependency so the mounted gates lint and build it as a workspace member.
[package]
name = "bilibi-people-walkthrough"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# The Attendance block has its own binary; keep the default Workforce command.
default-run = "bilibi-people-walkthrough"

[dependencies]
bilibi-affiliation.workspace = true
bilibi-authz.workspace = true
bilibi-base.workspace = true
bilibi-core.workspace = true
bilibi-database.workspace = true
bilibi-domains.workspace = true
bilibi-extensions.workspace = true
bilibi-module-registry.workspace = true
bilibi-people-workforce = { path = "../../workforce" }
bilibi-person.workspace = true
bilibi-tenancy.workspace = true
bilibi-user.workspace = true
bilibi-walkthrough-fixture = { path = "../../../../../fixtures/walkthrough" }
bilibi-web.workspace = true
jiff = "0.2.38"
tokio.workspace = true
tokio-postgres.workspace = true

# Claims (slice PC1).
bilibi-people-claims = { path = "../../claims" }
# PW1: the department Core Company adds for the employment change.
bilibi-company.workspace = true
serde_json.workspace = true

# Leave (slice PL1).
bilibi-people-leave = { path = "../../leave" }
rust_decimal.workspace = true

# Reference data (slice PD1).
bilibi-people-reference-data = { path = "../../reference_data" }

# Skills (PK1): the catalog proof block at the end of lib.rs.
bilibi-people-skills = { path = "../../skills" }

# Reviewed Leave entry operation (slice PL5).
bilibi-agent-api.workspace = true

# Organisation (PO1): the block `src/organisation.rs` runs from the end of `run`.
bilibi-audit.workspace = true
bilibi-people-organisation = { path = "../../organisation" }
bilibi-ports.workspace = true

# Leave carry-forward worker proof (slice PL2).
bilibi-queue.workspace = true

# Attendance (PA1).
bilibi-people-attendance = { path = "../../attendance" }

# Attendance (PA1).
bilibi-settings.workspace = true
